name: CI

# Her push ve PR'da: derleme kontrolü + testler. Deploy Render tarafında
# (main'e push → otomatik); eski SSH/VPS deploy workflow'u kaldırıldı.
# 15 Eyl 2026: Postgres servisi eklendi — migration zinciri boş DB'de
# (000_baseline + 001..N) koşar, ardından DB'li smoke testler çalışır.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTO_MIGRATE: "1"      # boş DB: 000_baseline + tüm migration'lar koşar (zincir testi)
      SENTRY_DSN: ""
      JWT_SECRET: "ci-only-not-a-real-secret"
      ADMIN_API_KEY: "ci-admin-key"
      REVENUECAT_WEBHOOK_AUTH: "ci-webhook-auth"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_NAME: "ci"
      DB_USER: "ci"
      DB_PASSWORD: "ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt pytest httpx
      - name: Byte-compile all modules
        run: python -m compileall -q app
      - name: Tests (statik + DB'li smoke)
        run: pytest -q tests
